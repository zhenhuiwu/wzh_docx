name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new tool release cannot turn CI red without a code change.
  RUFF_VERSION: "0.17.0"
  UV_VERSION: "0.12.23"

jobs:
  backend:
    name: 后端测试与 ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    env:
      DOCWB_TEST_DATABASE_URL: sqlite:////tmp/docwb-ci-test.db
      # 前端导航/路由权限一致性测试（tests/test_frontend_access.py）要用 Node 22（上面 setup-node 按 .nvmrc 安装）；
      # 设为 1 后缺 Node 时测试失败而不是跳过。
      DOCWB_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: 安装依赖
        run: uv sync --frozen
      - name: ruff
        run: uvx "ruff==${RUFF_VERSION}" check . ../deploy ../test_csrf.py --config pyproject.toml
      - name: 安装 Playwright Chromium
        run: uv run --frozen playwright install --with-deps chromium
      - name: 安装前端依赖（往返 E2E 打包 editorMarkdown 需要）
        working-directory: web
        run: npm ci
      - name: pytest（含 20 个模板的浏览器往返 E2E）
        env:
          DOCWB_E2E: "1"
        run: uv run --frozen pytest -q -rs
      - name: 部署快照检查
        working-directory: deploy
        run: ../server/.venv/bin/python test_snapshot_data.py

  windows:
    name: Windows 打包相关测试
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: 安装依赖
        run: uv sync --frozen
      - name: 桌面版与打包 worker 测试
        env:
          DOCWB_TEST_DATABASE_URL: sqlite:///${{ runner.temp }}/docwb-ci-test.db
        run: uv run --frozen pytest -q -rs tests/test_desktop_package.py tests/test_packaged_workers.py
      - name: 部署快照检查
        working-directory: deploy
        run: ../server/.venv/Scripts/python.exe test_snapshot_data.py
      - name: build.ps1 语法检查（不执行构建）
        shell: pwsh
        working-directory: deploy
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path build.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host 'build.ps1 语法正确'

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: vitest
        run: npx vitest run
      - run: npm audit --audit-level=high
