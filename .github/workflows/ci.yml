name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试与 ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DOCWB_TEST_DATABASE_URL: sqlite:////tmp/docwb-ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: uv sync --frozen
      - name: ruff
        run: uvx ruff check . ../deploy ../test_csrf.py ../start_enhanced.py --config pyproject.toml
      - name: 安装 Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: pytest
        run: uv run pytest -q -rs
      - name: 部署快照检查
        working-directory: deploy
        run: ../server/.venv/bin/python test_snapshot_data.py

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
